<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>AU perf</title></head><body style="margin:0;background:#000">
<video id="v" muted playsinline style="position:absolute;left:20px;top:20px;width:1280px;height:720px"></video>
<script>
  const src = document.createElement('canvas');
  src.width = 1280; src.height = 720;
  const g = src.getContext('2d');
  let t = 0;
  function paint() {
    t += 0.04;
    const grad = g.createLinearGradient(0, 0, 1280, 0);
    grad.addColorStop(0, '#1b2430'); grad.addColorStop(1, '#38506a');
    g.fillStyle = grad; g.fillRect(0, 0, 1280, 720);
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    for (let i = 0; i < 60; i++) {
      g.beginPath();
      g.moveTo((i * 31 + t * 60) % 1280, 0);
      g.lineTo((1280 - i * 23 + t * 40) % 1280, 720);
      g.stroke();
    }
    g.fillStyle = '#ff8800'; g.fillRect(380 + Math.sin(t) * 60, 240, 480, 240);
  }
  paint();
  setInterval(paint, 33);
  const v = document.getElementById('v');
  v.srcObject = src.captureStream(30);
  v.play().catch(() => {});
</script>
</body></html>
