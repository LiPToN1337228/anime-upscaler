<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>AU layout</title>
<style>
  body { margin: 0; background: #0b0d12; }
  #wrap { position: relative; width: 960px; height: 540px; margin: 60px auto; background: #000; overflow: hidden; }
  #v { position: absolute; inset: 0; width: 100%; height: 100%; }
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56px; z-index: 10;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #fff;
    font: 13px system-ui;
  }
  #btn { pointer-events: auto; padding: 6px 12px; background: #2b6d5b; border-radius: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <video id="v" muted playsinline></video>
  <div id="controls">
    <div id="btn">▶ play</div>
    <div id="seek" style="flex:1;height:6px;background:#444;border-radius:3px"></div>
  </div>
</div>
<script>
  const src = document.createElement('canvas');
  src.width = 640; src.height = 360;
  const g = src.getContext('2d');
  let t = 0;
  setInterval(() => {
    t += 0.05;
    g.fillStyle = '#1b2430'; g.fillRect(0, 0, 640, 360);
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    for (let i = 0; i < 30; i++) {
      g.beginPath();
      g.moveTo((i * 23 + t * 40) % 640, 0);
      g.lineTo((640 - i * 17 + t * 25) % 640, 360);
      g.stroke();
    }
    g.fillStyle = '#ff8800';
    g.fillRect(200 + Math.sin(t) * 40, 120, 240, 120);
  }, 33);

  const v = document.getElementById('v');
  v.srcObject = src.captureStream(30);
  v.play().catch(() => {});
  window.__wrap = document.getElementById('wrap');
</script>
</body>
</html>
